# Nombre fijo del proyecto
name: oncuidar-docker

services:
  db:
    image: docker.io/library/postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oncuidar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-oncuidar}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    # Node no corre como PID 1, asi recibe las senales y Docker lo reinicia si se cae
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "${PUERTO_API:-8080}:3000"

  web:
    image: docker.io/library/nginx:alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro,Z
    ports:
      - "${PUERTO_WEB:-8015}:80"

volumes:
  datos_postgres:
