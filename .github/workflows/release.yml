name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar etiqueta
        env:
          ETIQUETA: ${{ github.ref_name }}
          API_URL: ${{ vars.API_URL }}
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          if [ "$ETIQUETA" != "v$VERSION" ]; then
            echo "La etiqueta $ETIQUETA no coincide con la versión de pubspec.yaml (v$VERSION)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "La etiqueta $ETIQUETA no apunta a un commit de main"
            exit 1
          fi
          if [ -z "$API_URL" ]; then
            echo "Falta la variable API_URL en Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Pruebas
        run: flutter test

      - name: Llave de firma
        env:
          LLAVE: ${{ secrets.ANDROID_LLAVE }}
          CLAVE: ${{ secrets.ANDROID_CLAVE_LLAVE }}
        run: |
          if [ -z "$LLAVE" ] || [ -z "$CLAVE" ]; then
            echo "::warning::Sin ANDROID_LLAVE y ANDROID_CLAVE_LLAVE se firma con la llave de depuración"
            exit 0
          fi
          echo "$LLAVE" | base64 -d > android/app/oncuidar.jks
          printf 'storeFile=oncuidar.jks\nstorePassword=%s\nkeyAlias=oncuidar\nkeyPassword=%s\n' "$CLAVE" "$CLAVE" > android/key.properties

      - name: Compilar
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          flutter build apk --release --dart-define=API_URL="$API_URL" --build-number=${{ github.run_number }}
          mv build/app/outputs/flutter-apk/app-release.apk "OnCuidar-${{ github.ref_name }}.apk"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: gh release create "$ETIQUETA" "OnCuidar-$ETIQUETA.apk" --title "OnCuidar $ETIQUETA" --generate-notes --verify-tag
