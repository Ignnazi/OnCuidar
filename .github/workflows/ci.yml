name: CI

on:
  pull_request:
    branches: [main, desarrollo]
  push:
    branches: [main, desarrollo]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela: dejaría la publicación del despliegue a medias
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

  apk:
    name: APK
    needs: app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Verificar API_URL
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Falta la variable API_URL en Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - run: flutter pub get

      - name: Compilar
        env:
          API_URL: ${{ vars.API_URL }}
        run: flutter build apk --release --dart-define=API_URL="$API_URL"

      - uses: actions/upload-artifact@v7
        with:
          name: OnCuidar-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: oncuidar_pruebas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pruebas -d oncuidar_pruebas"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Esquema
        run: psql -v ON_ERROR_STOP=1 -f database/init.sql
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGUSER: pruebas
          PGPASSWORD: pruebas
          PGDATABASE: oncuidar_pruebas

      - run: npm ci
        working-directory: backend

      - name: Pruebas
        run: npm test
        working-directory: backend

      - name: Pruebas de los scripts de despliegue
        run: |
          bash test/despliegue/desplegar_test.sh
          bash test/despliegue/actualizar_test.sh

  imagen:
    name: Imagen
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Construir y publicar la imagen de la API
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oncuidar-api:${GITHUB_SHA}"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$imagen" backend
          docker push "$imagen"

  paquete:
    name: Paquete de despliegue
    needs: [app, apk, imagen]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: paquete
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: OnCuidar-${{ github.sha }}
          path: apk

      # El firewall de la universidad no deja entrar a GitHub por SSH: el servidor revisa
      # cada 15 minutos la etiqueta :main de este paquete y se despliega solo (scripts/actualizar.sh)
      - name: Publicar el paquete que descarga el servidor
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          duenio="${GITHUB_REPOSITORY_OWNER,,}"
          paquete="ghcr.io/$duenio/oncuidar-despliegue"
          mkdir entrante
          cp -r --parents docker-compose.yml database/init.sql monitoreo scripts web/index.html web/logo.png web/pantalla-inicio.jpg entrante/
          cp apk/app-release.apk entrante/web/OnCuidar.apk
          echo "ghcr.io/$duenio/oncuidar-api:${GITHUB_SHA}" > entrante/IMAGEN_API
          printf 'FROM scratch\nCOPY . /despliegue\n' > "$RUNNER_TEMP/Dockerfile.despliegue"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f "$RUNNER_TEMP/Dockerfile.despliegue" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$paquete:${GITHUB_SHA}" entrante
          docker push "$paquete:${GITHUB_SHA}"
          # Solo la versión más reciente de main se marca para desplegar
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            docker tag "$paquete:${GITHUB_SHA}" "$paquete:main"
            docker push "$paquete:main"
          else
            echo "Hay un commit más nuevo en main; este paquete no se marca para desplegar"
          fi
