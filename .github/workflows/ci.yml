name: CI

on:
  pull_request:
    branches: [main, desarrollo]
  push:
    branches: [main, desarrollo]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # En main no se cancela: cortaría un despliegue a medias
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

  apk:
    name: APK
    needs: app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Verificar API_URL
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Falta la variable API_URL en Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - run: flutter pub get

      - name: Compilar
        env:
          API_URL: ${{ vars.API_URL }}
        run: flutter build apk --release --dart-define=API_URL="$API_URL"

      - uses: actions/upload-artifact@v7
        with:
          name: OnCuidar-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: oncuidar_pruebas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pruebas -d oncuidar_pruebas"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Esquema
        run: psql -v ON_ERROR_STOP=1 -f database/init.sql
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGUSER: pruebas
          PGPASSWORD: pruebas
          PGDATABASE: oncuidar_pruebas

      - run: npm ci
        working-directory: backend

      - name: Pruebas
        run: npm test
        working-directory: backend

      - name: Pruebas del script de despliegue
        run: bash test/despliegue/desplegar_test.sh

  imagen:
    name: Imagen
    needs: backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Construir y publicar la imagen de la API
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oncuidar-api:${GITHUB_SHA}"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$imagen" backend
          docker push "$imagen"

  despliegue:
    name: Despliegue
    needs: [app, apk, imagen]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: produccion
      url: https://parra.chillan.ubiobio.cl/oncuidar/
    # Nunca dos despliegues a la vez, y uno empezado no se cancela
    concurrency:
      group: despliegue
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: OnCuidar-${{ github.sha }}
          path: apk

      - name: Preparar la conexión SSH
        env:
          LLAVE: ${{ secrets.PARRA_SSH_KEY }}
          HUELLA: ${{ secrets.PARRA_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LLAVE" > ~/.ssh/parra
          chmod 600 ~/.ssh/parra
          printf '%s\n' "$HUELLA" > ~/.ssh/known_hosts

      - name: Desplegar en parra
        env:
          SERVIDOR: ${{ secrets.PARRA_USUARIO }}@${{ secrets.PARRA_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          parra() { ssh -i ~/.ssh/parra -o BatchMode=yes -o StrictHostKeyChecking=yes "$SERVIDOR" "$@"; }
          imagen="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oncuidar-api:${GITHUB_SHA}"
          mkdir entrante
          cp -r --parents docker-compose.yml database/init.sql monitoreo scripts web/index.html web/logo.png entrante/
          cp apk/app-release.apk entrante/web/OnCuidar.apk
          tar -C entrante -czf - . | parra 'rm -rf ~/oncuidar/.despliegue && mkdir ~/oncuidar/.despliegue && tar -xzf - -C ~/oncuidar/.despliegue'
          printf '%s' "$TOKEN" | parra "bash ~/oncuidar/.despliegue/scripts/desplegar.sh '$imagen' '$GITHUB_ACTOR'"

      - name: Comprobar desde fuera
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://parra.chillan.ubiobio.cl/oncuidar-backend/api/salud
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null https://parra.chillan.ubiobio.cl/oncuidar/
