name: CI

on:
  pull_request:
    branches: [main, desarrollo]
  push:
    branches: [main, desarrollo]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

  apk:
    name: APK
    needs: app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Verificar API_URL
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Falta la variable API_URL en Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - run: flutter pub get

      - name: Compilar
        env:
          API_URL: ${{ vars.API_URL }}
        run: flutter build apk --release --dart-define=API_URL="$API_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: OnCuidar-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: oncuidar_pruebas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pruebas -d oncuidar_pruebas"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Esquema
        run: psql -v ON_ERROR_STOP=1 -f database/init.sql
        env:
          PGHOST: localhost
          PGPORT: 5433
          PGUSER: pruebas
          PGPASSWORD: pruebas
          PGDATABASE: oncuidar_pruebas

      - run: npm ci
        working-directory: backend

      - name: Pruebas
        run: npm test
        working-directory: backend
