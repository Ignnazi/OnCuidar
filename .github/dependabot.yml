version: 2

updates:
  - package-ecosystem: pub
    directory: /
    target-branch: desarrollo
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(app)"
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    target-branch: desarrollo
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(backend)"
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    target-branch: desarrollo
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(backend)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: desarrollo
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      acciones:
        patterns: ["*"]
