name: oncuidar
description: "Apoyo al cuidado oncológico pediátrico"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  go_router: ^17.3.0
  google_fonts: ^6.2.0

  # Firebase
  firebase_core: 4.13.0
  firebase_auth: 6.5.7
  cloud_firestore: 6.8.0
  cloud_functions: 6.3.6

  # Estado
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.3.0

  # Enlaces externos
  url_launcher: ^6.3.1

  # Encriptación
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  uuid: ^4.6.0
  pdf: ^3.12.0
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  open_filex: ^4.7.0

  # Biblioteca educativa
  video_player: ^2.9.3
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^4.2.0
  firebase_auth_mocks: ^0.15.2
  mock_exceptions: ^0.8.2
  archive: ^3.6.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/OnCuidar.png"
  background_color: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/OnCuidar.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/