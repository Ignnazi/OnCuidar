name: oncuidar
description: "Apoyo al cuidado oncológico pediátrico"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  google_fonts: ^6.2.0

  # Firebase
  firebase_core: 4.13.0
  firebase_auth: 6.5.7
  cloud_firestore: 6.8.0
  cloud_functions: 6.3.6

  # Estado
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.3.0

  # Encriptación
  cryptography: ^2.7.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^4.2.0
  firebase_auth_mocks: ^0.15.2
  mock_exceptions: ^0.8.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo1.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/